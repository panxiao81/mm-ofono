[package]
name = "mm-ofono"
version = "0.1.0"
edition = "2024"
description = "ModemManager D-Bus API on top of oFono"

[dependencies]
futures-util = "0.3"
rtnetlink = "0.20"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
udev = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus_xml = "5"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
