[package]
name = "mm-ofono"
version = "0.1.0"
edition = "2024"
description = "ModemManager D-Bus API on top of oFono"

[dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus_xml = "5"
