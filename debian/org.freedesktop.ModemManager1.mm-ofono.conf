<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  ModemManager 1.24's bus policy has no entries for Modem.CellBroadcast, so
  cellbroadcastd (running as the user) can't set channels. Upstream added
  them in 857efa1f (ModemManager 1.26); these are the same rules. It lives
  in /etc/dbus-1/system.d, which dbus-daemon reads after /usr/share's
  system.d (files within one directory come in no fixed order), so these
  allows come after ModemManager's deny of all method calls.
-->
<busconfig>
  <policy context="default">
    <!-- Allowed for everyone -->
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="List"/>

    <!-- Protected by the CellBroadcast policy rule -->
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="Delete"/>

    <!-- Protected by the Device.Control policy rule -->
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="SetChannels"/>
  </policy>
</busconfig>
